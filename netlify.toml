[build]
  command = "npm install --production=false && mkdir -p dist/public && npx vite build --outDir dist/public && mkdir -p dist/functions && npx esbuild src/functions/server.ts --platform=node --packages=external --bundle --format=esm --outfile=dist/functions/server.js"
  publish = "dist/public"
  functions = "dist/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/ws"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "dist/functions"
  node_bundler = "esbuild"