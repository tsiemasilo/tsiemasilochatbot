[build]
  command = "bash build-netlify-fresh.sh"
  publish = "dist/public"
  functions = "dist/functions"

[build.environment]
  NODE_VERSION = "18"
  NODE_ENV = "production"

# API redirects for serverless functions
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/contacts"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/admin/messages/*"
  to = "/.netlify/functions/admin-messages"
  status = 200

# Catch-all for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200